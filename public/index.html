<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Job Board</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <div class="logo">GC</div>
        <div>
          <h1>Globalco Jobs</h1>
          <div class="tag">Find your next role</div>
        </div>
      </div>
      <nav class="nav">
        <div id="userArea"></div>
        <button id="showAuth" class="btn secondary">Log in / Sign up</button>
      </nav>
    </header>

    <main>
      <section class="columns">
        <aside class="sidebar card">
          <div id="authPanel">
            <h3>Account</h3>
            <div class="auth-forms">
              <form id="signupForm" class="form small">
                <input id="su_username" class="input" placeholder="Username" required />
                <input id="su_password" type="password" class="input" placeholder="Password" required />
                <button class="btn primary" type="submit">Sign up</button>
              </form>

              <form id="loginForm" class="form small">
                <input id="li_username" class="input" placeholder="Username" required />
                <input id="li_password" type="password" class="input" placeholder="Password" required />
                <button class="btn primary" type="submit">Log in</button>
              </form>
            </div>

            <div class="tokenBox">
              <label>Saved Token</label>
              <textarea id="token" class="input" readonly></textarea>
              <button id="clearToken" class="btn secondary">Clear</button>
            </div>
          </div>

          <div class="card" style="margin-top:12px">
            <h3>Create Job</h3>
            <form id="createForm" class="form small">
              <input id="title" class="input" placeholder="Title" required />
              <input id="company" class="input" placeholder="Company" required />
              <input id="location" class="input" placeholder="Location" />
              <textarea id="description" class="input" placeholder="Description"></textarea>
              <button type="submit" class="btn primary">Create</button>
            </form>
          </div>
        </aside>

        <section class="content">
          <div class="card">
            <div class="toolbar">
              <input id="search" class="input" placeholder="Search roles, companies, keywords..." />
            </div>
            <h2>Open Roles</h2>
            <div id="list" class="job-list"></div>
            <div id="pagination" class="pagination"></div>
          </div>
        </section>
      </section>
    </main>

    <!-- Job details modal -->
    <div id="jobModal" class="modal" style="display:none">
      <div class="modal-content card">
        <button id="closeModal" class="btn secondary" style="float:right">Close</button>
        <h3 id="modalTitle"></h3>
        <div id="modalCompany" class="meta"></div>
        <p id="modalDesc"></p>
        <div style="margin-top:12px"><button id="modalApply" class="btn primary">Apply</button></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
